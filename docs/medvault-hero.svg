<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">MedVault — Healthcare Document Privacy Pipeline</title>
  <desc id="desc">An animated medical privacy banner with a scanning shield and DNA helix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#020a17"/><stop offset=".48" stop-color="#07182a"/><stop offset="1" stop-color="#120b2c"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#19e6dc"/><stop offset=".5" stop-color="#3d8cff"/><stop offset="1" stop-color="#b85cff"/></linearGradient>
    <linearGradient id="ink" x1="0" x2="1"><stop stop-color="#79fff7"/><stop offset=".48" stop-color="#d8f9ff"/><stop offset="1" stop-color="#cba6ff"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#5fcde6" stroke-opacity=".08"/></pattern>
    <style>
      .float { animation: float 5s ease-in-out infinite; transform-origin: center; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 4s ease-in-out infinite; }
      .flow { stroke-dasharray: 10 16; animation: flow 2.3s linear infinite; }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @keyframes pulse { 50% { opacity: .42; transform: scale(1.06); } }
      @keyframes scan { 0%, 10% { transform: translateX(-1080px); opacity: 0; } 18%, 76% { opacity: .9; } 92%, 100% { transform: translateX(1080px); opacity: 0; } }
      @keyframes flow { to { stroke-dashoffset: -52; } }
      @media (prefers-reduced-motion: reduce) { .float, .pulse, .scan, .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1600" height="480" rx="28" fill="url(#bg)"/><rect width="1600" height="480" rx="28" fill="url(#grid)"/>
  <ellipse cx="1420" cy="76" rx="310" ry="210" fill="#8447d9" opacity=".13"/><ellipse cx="205" cy="432" rx="370" ry="180" fill="#00d7c8" opacity=".11"/>
  <rect x="2" y="2" width="1596" height="476" rx="26" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="3"/>
  <g opacity=".45" fill="none" stroke="url(#edge)" stroke-width="3"><path d="M1280 60 C1450 145 1450 335 1280 420"/><path d="M1370 60 C1540 145 1540 335 1370 420"/><path d="M1190 60 C1360 145 1360 335 1190 420"/><path d="M1280 60 C1110 145 1110 335 1280 420"/><path d="M1370 60 C1200 145 1200 335 1370 420"/><path d="M1190 60 C1020 145 1020 335 1190 420"/></g>
  <g opacity=".55" stroke="url(#edge)" stroke-width="2" class="flow"><path d="M1120 112h350M1060 180h430M1050 248h460M1060 316h430M1120 384h350"/></g>
  <g class="float" transform="translate(130 122)"><circle cx="88" cy="118" r="92" fill="#13dbd1" opacity=".09" class="pulse"/><path d="M88 23 152 48v58c0 62-41 93-64 107-23-14-64-45-64-107V48z" fill="#0b2d4a" stroke="url(#edge)" stroke-width="5" filter="url(#glow)"/><path d="m57 115 21 21 42-48" fill="none" stroke="#8ffff5" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/><path d="M176 34v169" stroke="#42f4e5" stroke-opacity=".32" stroke-width="2"/><circle cx="176" cy="66" r="6" fill="#42f4e5" filter="url(#glow)"/><circle cx="176" cy="118" r="6" fill="#72a4ff" filter="url(#glow)"/><circle cx="176" cy="170" r="6" fill="#c773ff" filter="url(#glow)"/></g>
  <g transform="translate(400 133)"><rect x="0" y="0" width="253" height="38" rx="19" fill="#0d3744" stroke="#25e8dc" stroke-opacity=".8"/><circle cx="25" cy="19" r="7" fill="#34f5e8" class="pulse"/><text x="44" y="25" fill="#aafdf7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">PRIVACY BY DESIGN</text><text x="0" y="125" fill="url(#ink)" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-3">MedVault</text><text x="3" y="171" fill="#a8bdcf" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing="6">HEALTHCARE DOCUMENT PRIVACY PIPELINE</text><path d="M4 204h575" stroke="url(#edge)" stroke-width="3"/><text x="3" y="246" fill="#cce2ec" font-family="Arial, Helvetica, sans-serif" font-size="19">Detect. Redact. Verify. Share with confidence.</text></g>
  <g class="scan" opacity=".72"><rect x="0" y="0" width="170" height="480" fill="#6cddff" opacity=".06"/><path d="M0 0v480" stroke="#84ffff" stroke-width="3" filter="url(#glow)"/></g><g fill="#8dffff" filter="url(#glow)"><circle cx="1047" cy="99" r="4"/><circle cx="1503" cy="147" r="4"/><circle cx="1538" cy="337" r="5"/><circle cx="1090" cy="375" r="3"/></g>
</svg>
